# Speed profiles for netshape.sh. One profile per line. Six fields, | delimiter.
#
# name|bandwidth|delay_ms|loss|recommended|description
#
# name         The value for `netshape.sh on <name>`.
# bandwidth    Per-direction cap, in dnctl units. Example: 780Kbit/s
# delay_ms     Whole milliseconds, per direction. A round trip gains twice this.
# loss         0.0 through 1.0, per direction. A request and its reply compound.
# recommended  Put * here and the skill offers this profile first. Mark one row.
# description  One line. The skill shows it beside the name.

good|100Mbit/s|5|0||Healthy wifi baseline, for a control run
3g|780Kbit/s|100|0||Slow 3G, no loss
very-bad|1000Kbit/s|500|0.10|*|Matches Network Link Conditioner "Very Bad Network"
offline|1Mbit/s|0|1.0||Every matched packet dropped
